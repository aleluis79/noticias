server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Generating a summary can take a few minutes on a CPU-only host. Keep the
    # longer timeout on this exact path and leave the generic proxy as-is.
    location = /api/news/summary {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    # Proxy the API so the browser only talks to this origin (no CORS needed).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Scraping a source can take a while.
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location /swagger {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page application fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
